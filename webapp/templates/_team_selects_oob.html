{% macro team_input(side, teams) %}
  <input type="text" id="{{ side }}-select" name="{{ side }}" list="{{ side }}-teams-list" required hx-swap-oob="true"
    autocomplete="off" value=""
    placeholder="{{ t(request, 'simulate.choose_team') if teams else t(request, 'simulate.select_league_first') }}"
    {% if not teams %}disabled{% endif %}
    class="w-full rounded-lg border border-line bg-ink-2 px-3 py-2.5 text-paper outline-none focus:border-amber focus:ring-1 focus:ring-amber" />
  <datalist id="{{ side }}-teams-list" hx-swap-oob="true">
    {% for team in teams %}<option value="{{ team }}"></option>{% endfor %}
  </datalist>
{% endmacro %}

{{ team_input('home', teams) }}
{{ team_input('away', teams) }}
