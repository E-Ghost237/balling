{% extends "base.html" %}
{% block title %}{{ t(request, 'forgot.title') }}{% endblock %}
{% block page_bg %}bg-page-reset{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="mb-2 text-2xl font-semibold text-slate-900">{{ t(request, 'forgot.heading') }}</h1>
  <p class="mb-8 text-sm text-slate-500">{{ t(request, 'forgot.subtitle') }}</p>
  <form method="post" action="{{ url(request, '/forgot-password') }}" class="space-y-4">
    <div>
      <label class="mb-1 block text-sm text-slate-600">{{ t(request, 'common.email') }}</label>
      <input name="login" type="email" required autofocus
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
    </div>
    <button type="submit"
      class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-medium text-white hover:bg-emerald-500">
      {{ t(request, 'forgot.submit') }}
    </button>
  </form>
  <p class="mt-6 text-center text-sm text-slate-500">
    <a href="{{ url(request, '/login') }}" class="font-medium text-emerald-600 hover:underline">{{ t(request, 'forgot.back_to_login') }}</a>
  </p>
</div>
{% endblock %}
