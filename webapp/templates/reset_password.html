{% extends "base.html" %}
{% block title %}Reset password Balling Predictions{% endblock %}
{% block page_bg %}bg-page-reset{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="mb-2 text-2xl font-semibold text-slate-900">Enter your reset code</h1>
  <p class="mb-8 text-sm text-slate-500">
    If an account exists for <span class="font-medium text-slate-700">{{ login }}</span>, we've emailed a 6-digit code.
  </p>
  <form method="post" action="/reset-password" class="space-y-4">
    <input type="hidden" name="login" value="{{ login }}" />
    <div>
      <label class="mb-1 block text-sm text-slate-600">Verification code</label>
      <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-center text-lg tracking-[0.5em] text-slate-900 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-600">New password</label>
      <div class="relative">
        <input id="password" name="password" type="password" required minlength="8"
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 pr-16 text-slate-900 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
        <button type="button" onclick="togglePasswordField('password', this)"
          class="absolute inset-y-0 right-0 flex items-center px-3 text-xs font-medium text-slate-500 hover:text-slate-700">Show</button>
      </div>
    </div>
    <button type="submit"
      class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-medium text-white hover:bg-emerald-500">
      Reset password
    </button>
  </form>
  <form method="post" action="/forgot-password" class="mt-4 text-center">
    <input type="hidden" name="login" value="{{ login }}" />
    <button type="submit" class="text-sm text-emerald-600 hover:underline">Resend code</button>
  </form>
</div>
{% endblock %}
