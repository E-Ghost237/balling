{% extends "base.html" %}
{% block title %}{{ t(request, 'reset.title') }}{% endblock %}
{% block page_bg %}bg-page-reset{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="mb-2 text-2xl font-semibold text-slate-900">{{ t(request, 'reset.heading') }}</h1>
  <p class="mb-8 text-sm text-slate-500">
    {{ t(request, 'reset.subtitle_pre') }} <span class="font-medium text-slate-700">{{ login }}</span>,
    {{ t(request, 'reset.subtitle_post') }}
  </p>
  <form method="post" action="{{ url(request, '/reset-password') }}" class="space-y-4">
    <input type="hidden" name="login" value="{{ login }}" />
    <div>
      <label class="mb-1 block text-sm text-slate-600">{{ t(request, 'verify.code_label') }}</label>
      <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-center text-lg tracking-[0.5em] text-slate-900 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-600">{{ t(request, 'reset.new_password') }}</label>
      <div class="relative">
        <input id="password" name="password" type="password" required minlength="8"
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 pr-16 text-slate-900 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
        <button type="button" onclick="togglePasswordField('password', this)"
          data-show-label="{{ t(request, 'common.show') }}" data-hide-label="{{ t(request, 'common.hide') }}"
          class="absolute inset-y-0 right-0 flex items-center px-3 text-xs font-medium text-slate-500 hover:text-slate-700">{{ t(request, 'common.show') }}</button>
      </div>
    </div>
    <button type="submit"
      class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-medium text-white hover:bg-emerald-500">
      {{ t(request, 'reset.submit') }}
    </button>
  </form>
  <form method="post" action="{{ url(request, '/forgot-password') }}" class="mt-4 text-center">
    <input type="hidden" name="login" value="{{ login }}" />
    <button type="submit" class="text-sm text-emerald-600 hover:underline">{{ t(request, 'verify.resend') }}</button>
  </form>
</div>
{% endblock %}
