# Bare-IP / unmatched-Host fallback — kept on plain HTTP since there's no
# certificate for the raw IP. The domain below gets the HTTPS redirect.
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ballingpronostics.site www.ballingpronostics.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ballingpronostics.site www.ballingpronostics.site;

    ssl_certificate     /etc/letsencrypt/live/ballingpronostics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ballingpronostics.site/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
